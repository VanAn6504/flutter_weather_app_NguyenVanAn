name: weather_app
description: "Ứng dụng thời tiết toàn diện với dự báo thời tiết, tìm kiếm thành phố và hỗ trợ ngoại tuyến."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.0

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Local Storage & Caching
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.18.1
  cached_network_image: ^3.3.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Network Connectivity
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env


